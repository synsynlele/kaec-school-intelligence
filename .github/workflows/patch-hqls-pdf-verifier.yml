name: Patch HQLS PDF verifier

on:
  push:
    branches:
      - fix/hqls-pdf-teacher-layout
    paths:
      - .github/workflows/patch-hqls-pdf-verifier.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hqls-pdf-teacher-layout
      - name: Update structural PDF expectations
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-structure.mjs')
          text = path.read_text()
          old = '''  "Guide Guardrails",\n  "Full Illumination - teaching after struggle",'''
          new = '''  "Supporting notes",\n  "Guardrail",\n  "Full Illumination - concise teaching focus",'''
          if old not in text:
              raise SystemExit('Expected legacy PDF verifier block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-structure.mjs
          git commit -m "Align structural verifier with focused HQLS PDF layout"
          git push origin HEAD:fix/hqls-pdf-teacher-layout
