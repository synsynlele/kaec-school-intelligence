name: Patch HQLS PDF teacher focus

on:
  push:
    branches:
      - fix/hqls-pdf-teacher-focus
    paths:
      - .github/workflows/patch-hqls-pdf-teacher-focus.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hqls-pdf-teacher-focus
      - name: Apply HQLS PDF hierarchy patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          pdf_path = Path("lib/pdf/hqls-lesson-pdf.ts")
          text = pdf_path.read_text()

          text = text.replace(
              'import type { HqlsStageContent } from "@/lib/hqls/engine";\n',
              'import { HQLS_STAGES } from "@/lib/domain/hqls";\nimport type { HqlsStageContent } from "@/lib/hqls/engine";\n',
              1,
          )

          helper_marker = '''function rgb([r, g, b]: [number, number, number]) {
            return `${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)} rg`;
          }
          '''
          helpers = '''function canonicalStageDefinition(stageNumber: number) {
            return HQLS_STAGES[stageNumber - 1] ?? HQLS_STAGES[0];
          }

          function trimPdfText(value: string, maxChars: number) {
            const clean = ascii(value);
            if (clean.length <= maxChars) return clean;
            const candidate = clean.slice(0, Math.max(1, maxChars - 3));
            const lastSpace = candidate.lastIndexOf(" ");
            const trimmed = lastSpace > maxChars * 0.72 ? candidate.slice(0, lastSpace) : candidate;
            return `${trimmed.trim()}...`;
          }

          function conciseTeachingFocus(value: string) {
            const clean = ascii(value);
            if (!clean) return "";
            const sentences = clean
              .split(/(?<=[.!?])\\s+/)
              .map((sentence) => sentence.trim())
              .filter(Boolean);
            const maxChars = 900;
            const selected = sentences.slice(0, Math.min(6, sentences.length)).join(" ");
            return trimPdfText(selected || clean, maxChars);
          }

          function compactSupportValue(value: string | string[]) {
            const text = Array.isArray(value)
              ? value.filter(Boolean).slice(0, 4).join("; ")
              : value;
            return trimPdfText(text, 360);
          }

          function rgb([r, g, b]: [number, number, number]) {
            return `${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)} rg`;
          }

          function strokeRgb([r, g, b]: [number, number, number]) {
            return `${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)} RG`;
          }
          '''
          if helper_marker not in text:
              raise SystemExit("Could not find rgb helper marker")
          text = text.replace(helper_marker, helpers, 1)

          bullet_marker = '''  bullet(text: string, color: [number, number, number] = TEXT) {
            this.line(`- ${text}`, { indent: 12, maxWidth: CONTENT_WIDTH - 12, color, size: 9.4 });
          }

          addLesson() {
          '''
          bullet_replacement = '''  bullet(text: string, color: [number, number, number] = TEXT) {
            this.line(`- ${text}`, { indent: 12, maxWidth: CONTENT_WIDTH - 12, color, size: 9.4 });
          }

          supportPanel(
            sections: Array<{
              label: string;
              value: string | string[];
              labelColor?: [number, number, number];
            }>,
          ) {
            const prepared = sections
              .map((section) => ({
                ...section,
                text: compactSupportValue(section.value),
              }))
              .filter((section) => Boolean(section.text));
            if (!prepared.length) return;

            const innerWidth = CONTENT_WIDTH - 20;
            const bodySize = 7.7;
            const bodyLeading = 10.1;
            const rows = prepared.map((section) => ({
              ...section,
              lines: wrapText(section.text, innerWidth, bodySize),
            }));
            const height =
              28 +
              rows.reduce(
                (total, row) => total + 10 + row.lines.length * bodyLeading + 4,
                0,
              );

            this.ensure(height + 8);
            const top = this.y;
            const bottom = top - height;
            this.current.push("q 0.973 0.978 0.982 rg");
            this.current.push(`${LEFT} ${bottom.toFixed(1)} ${CONTENT_WIDTH} ${height.toFixed(1)} re f Q`);
            this.current.push(`q ${strokeRgb([0.82, 0.84, 0.87])} 0.7 w`);
            this.current.push(`${LEFT} ${bottom.toFixed(1)} ${CONTENT_WIDTH} ${height.toFixed(1)} re S Q`);

            let cursor = top - 13;
            this.current.push(rgb(NAVY));
            this.current.push(
              `BT /F2 8.2 Tf 1 0 0 1 ${(LEFT + 10).toFixed(1)} ${cursor.toFixed(1)} Tm (Support cues) Tj ET`,
            );
            cursor -= 14;

            for (const row of rows) {
              this.current.push(rgb(row.labelColor ?? MUTED));
              this.current.push(
                `BT /F2 7.5 Tf 1 0 0 1 ${(LEFT + 10).toFixed(1)} ${cursor.toFixed(1)} Tm (${pdfEscape(row.label)}) Tj ET`,
              );
              cursor -= 9.5;
              this.current.push(rgb(TEXT));
              for (const line of row.lines) {
                this.current.push(
                  `BT /F1 ${bodySize.toFixed(1)} Tf 1 0 0 1 ${(LEFT + 10).toFixed(1)} ${cursor.toFixed(1)} Tm (${pdfEscape(line)}) Tj ET`,
                );
                cursor -= bodyLeading;
              }
              cursor -= 4;
            }

            this.y = bottom - 7;
          }

          addLesson() {
          '''
          if bullet_marker not in text:
              raise SystemExit("Could not find bullet/addLesson marker")
          text = text.replace(bullet_marker, bullet_replacement, 1)

          stage_pattern = re.compile(
              r'''    for \(const stage of this\.input\.stages\) \{.*?      this\.rule\(\);\n    \}''',
              re.S,
          )
          stage_replacement = '''    for (const stage of this.input.stages) {
              const definition = canonicalStageDefinition(stage.stageNumber);
              this.ensure(115);
              this.line(`STAGE ${stage.stageNumber} - ${definition.title}`, {
                bold: true,
                size: 13,
                color: NAVY,
                gapBefore: 7,
                gapAfter: 3,
              });
              this.line(definition.purpose, { size: 9, color: MUTED, gapAfter: 6 });

              if (stage.experience) {
                this.line("Core learning experience", {
                  bold: true,
                  size: 10,
                  color: BLUE,
                  gapAfter: 2,
                });
                this.line(stage.experience, { size: 9.5, gapAfter: 5 });
              }

              if (stage.teacherPrompts.length) {
                this.line("Teacher prompts / actions", {
                  bold: true,
                  size: 10,
                  color: BLUE,
                  gapAfter: 2,
                });
                stage.teacherPrompts.forEach((item) => this.bullet(item));
              }

              if (stage.stageNumber === 5 && stage.teachingContent) {
                this.line("Concise teaching focus", {
                  bold: true,
                  size: 10.2,
                  color: NAVY,
                  gapBefore: 3,
                  gapAfter: 2,
                });
                this.line(conciseTeachingFocus(stage.teachingContent), {
                  size: 9.5,
                  gapAfter: 5,
                });
              }

              if (stage.respondsToFirstAttempt) {
                this.line("Connection to Trial 1", {
                  bold: true,
                  size: 8.4,
                  color: MUTED,
                  gapBefore: 1,
                  gapAfter: 1,
                });
                this.line(trimPdfText(stage.respondsToFirstAttempt, 420), {
                  size: 8.2,
                  color: MUTED,
                  gapAfter: 4,
                });
              }

              if (stage.reflectionPrompt) {
                this.line("Reflection prompt", {
                  bold: true,
                  size: 9.6,
                  color: BLUE,
                  gapBefore: 2,
                  gapAfter: 2,
                });
                this.line(stage.reflectionPrompt, { size: 9.2 });
              }
              if (stage.transferTask) {
                this.line("Transfer task", {
                  bold: true,
                  size: 9.6,
                  color: BLUE,
                  gapBefore: 2,
                  gapAfter: 2,
                });
                this.line(stage.transferTask, { size: 9.2, gapAfter: 5 });
              }

              this.supportPanel([
                {
                  label: "Expected learner outcome",
                  value: stage.learnerActions,
                },
                {
                  label: "Guide guardrail",
                  value: stage.guideGuardrails,
                  labelColor: RED,
                },
                {
                  label: "Evidence to notice",
                  value: stage.evidenceToNotice,
                },
                {
                  label: "Productive struggle",
                  value: stage.productiveStruggle,
                  labelColor: RED,
                },
              ]);
              this.rule();
            }'''
          text, count = stage_pattern.subn(stage_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one HQLS stage loop, found {count}")

          pdf_path.write_text(text)

          package = Path("package.json")
          package_text = package.read_text()
          marker = '&& node scripts/verify-hqls-draft-recovery.mjs",'
          replacement = '&& node scripts/verify-hqls-draft-recovery.mjs && node scripts/verify-hqls-pdf-teacher-focus.mjs",'
          if marker not in package_text:
              raise SystemExit("Could not find verify:structure HQLS recovery marker")
          package.write_text(package_text.replace(marker, replacement, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pdf/hqls-lesson-pdf.ts package.json
          git commit -m "Refine HQLS teacher PDF hierarchy"
          git push origin HEAD:fix/hqls-pdf-teacher-focus
