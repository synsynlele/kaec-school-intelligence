name: Stage 7 lockfile repair

on:
  push:
    branches:
      - agent/khpos-stage-7-integration

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/khpos-stage-7-integration
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify patched nanoid resolution
        run: node -e "const l=require('./package-lock.json'); const p=l.packages['node_modules/nanoid']; if(!p || p.version!=='3.3.18') { console.error(p); process.exit(1); } console.log('nanoid',p.version)"

      - name: Clean install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Strict TypeScript
        run: npm run typecheck

      - name: Constitutional structure
        run: npm run verify:structure

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Commit generated lockfile and remove repair workflow
        run: |
          rm .github/workflows/stage7-lock-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/stage7-lock-repair.yml
          CHANGED="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' '.github/workflows/stage7-lock-repair.yml' 'package-lock.json' | sort)"
          test "$CHANGED" = "$EXPECTED"
          git commit -m "refresh patched Stage 7 lockfile"
          git push origin HEAD:agent/khpos-stage-7-integration
