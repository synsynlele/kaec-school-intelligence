name: Stage 17 Lockfile Refresh

on:
  push:
    branches:
      - stage17-ksi-lite-distribution
    paths:
      - package.json
      - .github/workflows/stage17-refresh-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Stage 17 branch
        uses: actions/checkout@v4
        with:
          ref: stage17-ksi-lite-distribution

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify dependency audit
        run: npm audit --audit-level=high

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "Refresh lockfile for patched Browserslist"
          git push origin HEAD:stage17-ksi-lite-distribution
