name: Update HQLS prompt contract verification

on:
  push:
    branches:
      - fix/hqls-pdf-teacher-focus
    paths:
      - .github/workflows/update-hqls-prompt-contract.yml

permissions:
  contents: write

jobs:
  update-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hqls-pdf-teacher-focus
      - name: Update governed prompt-version assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-structure.mjs')
          text = p.read_text()
          old = '  "HQLS_PROMPT_v1.3",'
          new = '  "HQLS_PROMPT_v1.4",'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one v1.3 prompt contract, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-hqls-prompt-contract.yml
          git add scripts/verify-structure.mjs
          git commit -m "Update HQLS prompt v1.4 structural contract"
          git push origin HEAD:fix/hqls-pdf-teacher-focus
