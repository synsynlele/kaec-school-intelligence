name: Dependency Refresh

on:
  push:
    branches:
      - stage-1-platform-foundation
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage-1-platform-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh vulnerable dependencies
        run: |
          npm install --package-lock-only --save-exact next@16.3.0 eslint-config-next@16.3.0 @tailwindcss/postcss@4.3.3 tailwindcss@4.3.3
          npm audit fix --package-lock-only

      - name: Verify high-severity audit gate
        run: npm audit --audit-level=high

      - name: Commit refreshed manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency manifest changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Align secure Next.js toolchain"
          git push origin HEAD:stage-1-platform-foundation
