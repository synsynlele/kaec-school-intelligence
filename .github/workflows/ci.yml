name: KSI CI

on:
  push:
    branches:
      - main
      - stage-1-platform-foundation
      - stage-2-hqls-lesson-intelligence
      - stage-3-assessment-intelligence
      - stage-4-student-diagnosis-intelligence
      - stage-5-action-intervention-intelligence
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Synchronize Stage 12 lockfile once
        if: github.event_name == 'pull_request' && github.head_ref == 'stage-12-curriculum-review-console'
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Security: synchronize patched nanoid lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Constitutional structure
        run: npm run verify:structure
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
