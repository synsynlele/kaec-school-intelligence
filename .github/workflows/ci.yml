name: KSI CI

on:
  push:
    branches:
      - main
      - stage-1-platform-foundation
      - stage-2-hqls-lesson-intelligence
      - stage-3-assessment-intelligence
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Constitutional structure
        run: npm run verify:structure
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
