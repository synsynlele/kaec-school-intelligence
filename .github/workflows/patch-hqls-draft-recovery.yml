name: Patch HQLS draft recovery

on:
  push:
    branches:
      - fix/hqls-draft-recovery
    paths:
      - .github/workflows/patch-hqls-draft-recovery.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hqls-draft-recovery
      - name: Apply focused HQLS recovery patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def sub_once(path, pattern, replacement, flags=0):
              p = Path(path)
              text = p.read_text()
              next_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"Expected exactly one regex match in {path}, found {count}: {pattern[:80]}")
              p.write_text(next_text)

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one literal match in {path}, found {count}: {old[:80]}")
              p.write_text(text.replace(old, new, 1))

          route = "app/api/hqls/route.ts"
          helper_block = '''function requireString(value: unknown, label: string) {
            if (typeof value !== "string" || !value.trim()) {
              throw new Error(`${label} is required.`);
            }
            return value.trim();
          }

          function academicWords(value: string) {
            return value.toLowerCase().match(/[a-z0-9]+/g) ?? [];
          }

          function compactAcademicLabel(value: string, omitGenericSubjectWords = false) {
            const words = academicWords(value).filter(
              (word) =>
                !omitGenericSubjectWords ||
                (word !== "language" && word !== "studies"),
            );
            return words.join("");
          }

          function academicAcronym(value: string) {
            return academicWords(value)
              .filter((word) => !["and", "of", "the"].includes(word))
              .map((word) => word[0] ?? "")
              .join("");
          }

          function findUniqueAcademicMatch<T extends { id: string; name: string }>(
            rows: T[],
            requested: string,
            kind: "class" | "subject",
          ) {
            const compactRequested = compactAcademicLabel(requested);
            const simplifiedRequested = compactAcademicLabel(
              requested,
              kind === "subject",
            );
            const matches = rows.filter((row) => {
              if (compactAcademicLabel(row.name) === compactRequested) return true;
              if (kind === "class") return false;
              if (
                simplifiedRequested &&
                compactAcademicLabel(row.name, true) === simplifiedRequested
              ) {
                return true;
              }
              return academicAcronym(row.name) === compactRequested;
            });
            return matches.length === 1 ? matches[0] : null;
          }'''
          sub_once(route, r'function requireString\(value: unknown, label: string\) \{.*?\n\}', helper_block, re.S)

          academic_context = '''async function resolveAcademicContext(
            supabase: KsiSupabaseClient,
            input: HqlsLessonRequest,
          ) {
            let subjectId = input.subjectId;
            let classId = input.classId;
            let subject = input.subject;
            let classLevel = input.classLevel;
            let ageRange = input.ageRange;

            if (subjectId) {
              const { data, error } = await supabase
                .from("subjects")
                .select("id,name,active")
                .eq("id", subjectId)
                .eq("workspace_id", input.workspaceId)
                .single();
              if (error || !data || !data.active) {
                throw new Error("The selected subject is not available in this workspace.");
              }
              subject = data.name;
            } else {
              const { data, error } = await supabase
                .from("subjects")
                .select("id,name")
                .eq("workspace_id", input.workspaceId)
                .eq("active", true);
              if (error) throw error;
              const matched = findUniqueAcademicMatch(data ?? [], subject, "subject");
              if (matched) {
                subjectId = matched.id;
                subject = matched.name;
              }
            }

            if (classId) {
              const { data, error } = await supabase
                .from("classes")
                .select("id,name,age_range,active")
                .eq("id", classId)
                .eq("workspace_id", input.workspaceId)
                .single();
              if (error || !data || !data.active) {
                throw new Error("The selected class is not available in this workspace.");
              }
              classLevel = data.name;
              ageRange = input.ageRange || data.age_range || input.ageRange;
            } else {
              const { data, error } = await supabase
                .from("classes")
                .select("id,name,age_range")
                .eq("workspace_id", input.workspaceId)
                .eq("active", true);
              if (error) throw error;
              const matched = findUniqueAcademicMatch(data ?? [], classLevel, "class");
              if (matched) {
                classId = matched.id;
                classLevel = matched.name;
                ageRange = input.ageRange || matched.age_range || input.ageRange;
              }
            }

            return { ...input, subjectId, classId, subject, classLevel, ageRange };
          }'''
          sub_once(route, r'async function resolveAcademicContext\(.*?\n\}\n\nasync function enforceAiRateLimit', academic_context + "\n\nasync function enforceAiRateLimit", re.S)

          sub_once(
              route,
              r'    const validatedInput = validateGenerateInput\(rawInput\);\n    await requireWorkspace\(supabase, validatedInput\.workspaceId\);\n    const input = await resolveAcademicContext\(supabase, validatedInput\);\n    await enforceAiRateLimit\(supabase, userId, input\.workspaceId\);',
              '''    const validatedInput = validateGenerateInput(rawInput);
              const workspace = await requireWorkspace(supabase, validatedInput.workspaceId);
              const input = await resolveAcademicContext(supabase, validatedInput);
              if (
                workspace.workspace_type === "school" &&
                (!input.subjectId || !input.classId)
              ) {
                throw new Error(
                  "Choose a subject and class registered in the active school before generating an HQLS lesson. KSI will accept normal variations such as SS 1/SS1 and common subject abbreviations when they resolve uniquely.",
                );
              }
              await enforceAiRateLimit(supabase, userId, input.workspaceId);''',
          )

          save_validation = '''async function saveLessonValidation(args: {
            supabase: KsiSupabaseClient;
            lesson: LessonRow;
            validation: ReturnType<typeof validateHqlsLesson>;
          }) {
            const { data, error } = await args.supabase
              .from("lessons")
              .update({
                status: args.validation.passed ? "validated" : "draft",
                validation_summary: toJson(args.validation),
                engine_version: HQLS_ENGINE_VERSION,
                prompt_version: HQLS_PROMPT_VERSION,
              })
              .eq("id", args.lesson.id)
              .select("id,status,validation_summary")
              .single();
            if (error) throw error;
            if (!data) {
              throw new Error("The HQLS lesson validation state was not saved.");
            }
          }'''
          sub_once(route, r'async function saveLessonValidation\(args: \{.*?\n\}\n\nfunction configuredOpenAIModel', save_validation + "\n\nfunction configuredOpenAIModel", re.S)

          client = "components/hqls/hqls-client.tsx"
          replace_once(
              client,
              '  const refreshLessons = useCallback(async () => {',
              '''  const needsFinalValidation = Boolean(
            selectedLesson?.status === "draft" &&
              validation === null &&
              selectedLesson.class_id &&
              selectedLesson.subject_id,
          );

          const refreshLessons = useCallback(async () => {''',
          )
          replace_once(client, 'disabled={saving || !dirty}', 'disabled={saving || (!dirty && !needsFinalValidation)}')
          replace_once(
              client,
              '{saving ? "Saving + checking…" : dirty ? "Save edits" : "Saved"}',
              '''{saving
                      ? "Saving + checking…"
                      : needsFinalValidation
                        ? "Finish validation"
                        : dirty
                          ? "Save edits"
                          : "Saved"}''',
          )
          replace_once(
              client,
              '            {validation && !validation.passed ? (',
              '''            {needsFinalValidation ? (
              <div className="mt-4 rounded-2xl border border-blue-200 bg-blue-50 p-5 text-sm text-blue-950">
                <p className="font-semibold">This HQLS lesson is fully generated.</p>
                <p className="mt-1 leading-6">
                  Its school class and subject are now linked. Finish validation to restore the fidelity record without regenerating the lesson or using more AI tokens.
                </p>
              </div>
            ) : null}

            {validation && !validation.passed ? (''',
          )

          saved = "components/saved-work/saved-work-client.tsx"
          replace_once(
              saved,
              'import { useCallback, useEffect, useMemo, useState } from "react";',
              'import Link from "next/link";\nimport { useCallback, useEffect, useMemo, useState } from "react";',
          )
          sub_once(
              saved,
              r'                    \{view === "active" \? \(\n                      <button\n                        type="button"\n                        disabled=\{!item\.canManage \|\| busyKey !== null\}\n                        onClick=\{\(\) => void manage\(item, "archive"\)\}\n                        className="min-h-10 rounded-xl border border-zinc-300 px-4 py-2 text-sm font-semibold text-zinc-800 disabled:cursor-not-allowed disabled:opacity-40"\n                      >\n                        \{busyKey === archiveKey \? "Archiving…" : "Archive"\}\n                      </button>\n                    \) : \(',
              '''                    {view === "active" ? (
                      <>
                        {item.artifactType === "lesson" ? (
                          <Link
                            href={`/hqls?lesson=${encodeURIComponent(item.artifactId)}`}
                            className="min-h-10 rounded-xl bg-emerald-950 px-4 py-2 text-sm font-semibold text-white"
                          >
                            Open HQLS
                          </Link>
                        ) : null}
                        <button
                          type="button"
                          disabled={!item.canManage || busyKey !== null}
                          onClick={() => void manage(item, "archive")}
                          className="min-h-10 rounded-xl border border-zinc-300 px-4 py-2 text-sm font-semibold text-zinc-800 disabled:cursor-not-allowed disabled:opacity-40"
                        >
                          {busyKey === archiveKey ? "Archiving…" : "Archive"}
                        </button>
                      </>
                    ) : (''',
          )

          package = "package.json"
          replace_once(
              package,
              '&& node scripts/verify-teacher-artifact-isolation.mjs",',
              '&& node scripts/verify-teacher-artifact-isolation.mjs && node scripts/verify-hqls-draft-recovery.mjs",',
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/hqls/route.ts components/hqls/hqls-client.tsx components/saved-work/saved-work-client.tsx package.json
          git commit -m "Fix HQLS draft finalisation and saved-plan access"
          git push origin HEAD:fix/hqls-draft-recovery
