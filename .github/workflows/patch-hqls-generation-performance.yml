name: Patch HQLS generation performance

on:
  push:
    branches:
      - fix/hqls-pdf-teacher-focus
    paths:
      - .github/workflows/patch-hqls-generation-performance.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hqls-pdf-teacher-focus
          fetch-depth: 0

      - name: Apply HQLS performance changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) OpenAI transport: explicit model alignment, low-latency controls and prompt caching.
          path = Path("lib/ai/openai.ts")
          text = path.read_text()
          text = text.replace(
              'export type OpenAIReasoningEffort = "minimal" | "low" | "medium" | "high";',
              'export type OpenAIReasoningEffort = "none" | "minimal" | "low" | "medium" | "high";\nexport type OpenAITextVerbosity = "low" | "medium" | "high";',
              1,
          )
          text = text.replace(
              '  reasoningEffort?: OpenAIReasoningEffort;\n};',
              '  reasoningEffort?: OpenAIReasoningEffort;\n  model?: string;\n  promptCacheKey?: string;\n  promptCacheTtl?: "30m";\n  textVerbosity?: OpenAITextVerbosity;\n};',
              1,
          )
          old_model = '''  // KSI uses GPT-5 mini for core educational generation. The existing\n  // environment override is retained so deployments can be changed deliberately\n  // without exposing model configuration to the browser.\n  const model =\n    process.env.KSI_OPENAI_MODEL?.trim() ||\n    process.env.KSI_AI_MODEL?.trim() ||\n    "gpt-5-mini";'''
          new_model = '''  // Callers may pin the model so audit records and the actual provider request\n  // cannot drift. Environment overrides remain available for deliberate rollouts.\n  const model =\n    input.model?.trim() ||\n    process.env.KSI_OPENAI_MODEL?.trim() ||\n    process.env.KSI_AI_MODEL?.trim() ||\n    "gpt-5.6-terra";'''
          if old_model not in text:
              raise SystemExit("Could not find OpenAI model fallback block")
          text = text.replace(old_model, new_model, 1)
          old_text_config = '''        text: {\n          format: {\n            type: "json_schema",\n            name: input.schemaName ?? "ksi_hqls_response",\n            strict: true,\n            schema: strictifySchema(input.responseSchema),\n          },\n        },\n        ...(supportsReasoningEffort(model)\n          ? { reasoning: { effort: reasoningEffort } }\n          : {}),\n        max_output_tokens: input.maxOutputTokens ?? 12000,'''
          new_text_config = '''        text: {\n          format: {\n            type: "json_schema",\n            name: input.schemaName ?? "ksi_hqls_response",\n            strict: true,\n            schema: strictifySchema(input.responseSchema),\n          },\n          ...(input.textVerbosity && model.startsWith("gpt-5")\n            ? { verbosity: input.textVerbosity }\n            : {}),\n        },\n        ...(supportsReasoningEffort(model)\n          ? { reasoning: { effort: reasoningEffort } }\n          : {}),\n        ...(input.promptCacheKey\n          ? { prompt_cache_key: input.promptCacheKey }\n          : {}),\n        ...(input.promptCacheKey && model.startsWith("gpt-5.6")\n          ? { prompt_cache_options: { ttl: input.promptCacheTtl ?? "30m" } }\n          : {}),\n        max_output_tokens: input.maxOutputTokens ?? 12000,'''
          if old_text_config not in text:
              raise SystemExit("Could not find OpenAI request text config block")
          text = text.replace(old_text_config, new_text_config, 1)
          path.write_text(text)

          # 2) HQLS prompting: retain completeness but stop asking for textbook-length output.
          path = Path("lib/hqls/engine.ts")
          text = path.read_text()
          text = text.replace(
              'export const HQLS_PROMPT_VERSION = "HQLS_PROMPT_v1.3";',
              'export const HQLS_PROMPT_VERSION = "HQLS_PROMPT_v1.4";',
              1,
          )
          text = text.replace(
              '- Make the teaching accurate, detailed, age-appropriate and genuinely useful to the stated lesson objective.',
              '- Make the teaching accurate, age-appropriate, concise and genuinely useful to the stated lesson objective. Cover what the objective requires without turning Stage 5 into an exhaustive textbook chapter.',
              1,
          )
          old_module = '''FULL ILLUMINATION — NORMAL LESSON MODE:\nStage 5 is not to be written in the special HQLS facilitation style used by the surrounding stages. Write it like an excellent normal lesson note and full classroom explanation a competent teacher can teach from directly.\n\nInside teachingContent, give the actual lesson content, not instructions about content. Teach the topic fully to the depth required by the lesson objective. Use the conventional structure that best suits the subject. It may include, without restriction:\n- introduction to the concept;\n- formal definitions and key terms;\n- detailed explanatory notes;\n- facts, features, types, classifications, properties and relationships;\n- principles, rules, laws, formulas, processes, procedures and conventions;\n- derivations or reasons where useful;\n- diagrams described in words where useful;\n- worked examples, calculations, model answers, demonstrations and step-by-step solutions;\n- board-ready or note-ready material learners can copy;\n- teacher explanations in natural classroom language;\n- corrections of misconceptions and common errors;\n- questions and answers;\n- summaries, memory aids and evaluation examples;\n- links to familiar real-life experiences and applications whenever they help learners understand the concept.\n\nThere is no required Full Illumination template, no required number of examples, no required number of real-life connections, no required number of teacher prompts, and no requirement that the teaching be organised around Trial 1 mistakes. Trial 1 may be referenced if useful, but it must not limit the scope or style of the normal lesson.\n\nDo not artificially shorten Full Illumination. Give teachers enough substantive content to serve as both their lesson note and the explanation they can deliver in class. A teacher should be able to read Stage 5, understand the concept, write or display appropriate notes, explain it properly and teach it without needing a separate lesson note. Real-life support may include at least two concrete experiences or applications when that naturally improves the lesson, but there is no fixed number.\n'''
          new_module = '''FULL ILLUMINATION — NORMAL LESSON MODE:\nStage 5 is normal teaching, not discovery/facilitation mode. Put the actual lesson content inside teachingContent so the teacher can teach from it directly.\n\nKeep Full Illumination concise but complete for the stated objective. For an ordinary lesson, aim for roughly 250–450 words; use up to about 650 only when a calculation, procedure or worked example genuinely needs it. Prioritise:\n- the essential concept, definitions, rule/process/formula or core facts;\n- one clear worked example, demonstration or model answer when it improves understanding;\n- the most important misconception or error to correct;\n- a brief real-life connection when useful;\n- a short teaching summary or board-ready takeaway.\n\nAvoid long introductions, repeated explanations, exhaustive classifications, multiple similar examples and textbook-style padding. The teacher needs a clear teaching core, not a chapter.\n'''
          if old_module not in text:
              raise SystemExit("Could not find Full Illumination module rules")
          text = text.replace(old_module, new_module, 1)
          text = text.replace(
              'For Stages 1, 2, 3, 4, 6 and 7 include:\n- a concrete learning experience/task;\n- exact teacher prompts/actions where useful;\n- expected learner actions;\n- Guide Guardrails describing what the teacher must not do;\n- observable evidence the teacher should notice.',
              'For Stages 1, 2, 3, 4, 6 and 7 keep the output focused:\n- a concrete learning experience/task in 1–3 sentences;\n- no more than 3 exact teacher prompts/actions where useful;\n- no more than 3 expected learner actions;\n- no more than 2 Guide Guardrails describing what the teacher must not do;\n- no more than 3 observable evidence items the teacher should notice.',
              1,
          )
          old_generation = '''IMPORTANT: Stage 5 Full Illumination is NORMAL LESSON MODE. Stop using the discovery/facilitation style when Stage 5 begins. Write a detailed conventional lesson note and the actual teaching of the concept inside teachingContent. The teacher is free to teach normally: explain, lecture, define, give notes, write on the board, teach rules/formulas/laws, demonstrate, solve examples and correct learners. Use whatever conventional teaching structure best fits ${input.subject.trim()} and this topic. Relate the concept to real-life experiences where that improves understanding. Do not force Stage 5 to be concise, inquiry-led, learner-led, Trial-1-led or anti-note. Do not write placeholders such as “teacher explains”; write the explanation and lesson note itself.'''
          new_generation = '''IMPORTANT: Stage 5 Full Illumination is NORMAL LESSON MODE. Write the actual teaching content inside teachingContent, but keep it concise and objective-led. Include only the essential explanation, key terms/rule/process, one useful example when needed, the main misconception to correct, and a short takeaway. Do not write placeholders such as “teacher explains”, and do not pad the lesson with repeated or textbook-length detail.'''
          if old_generation not in text:
              raise SystemExit("Could not find generation Full Illumination paragraph")
          text = text.replace(old_generation, new_generation, 1)
          text = text.replace(
              'Return the full corrected seven-stage lesson. Never move Full Illumination before Trial 1. Do not impose HQLS facilitation restrictions on Stage 5: it must remain a normal, detailed conventional lesson note and full teaching explanation. Stage 7 must keep an explicit reflectionPrompt and a distinct transferTask.',
              'Return the full corrected seven-stage lesson. Never move Full Illumination before Trial 1. Stage 5 remains normal teaching but must be concise, accurate and limited to what the lesson objective requires. Stage 7 must keep an explicit reflectionPrompt and a distinct transferTask.',
              1,
          )
          text = text.replace(
              'If the target is Stage 5, teachingContent must be a detailed normal lesson note and full teacher explanation, with no HQLS teaching-style restrictions beyond remaining Stage 5 after Trial 1.',
              'If the target is Stage 5, teachingContent must be a concise normal teaching explanation focused on the lesson objective, with no HQLS teaching-style restrictions beyond remaining Stage 5 after Trial 1.',
              1,
          )
          text = text.replace(
              'Preserve detailed conventional teaching.',
              'Preserve concise, accurate conventional teaching.',
              1,
          )
          path.write_text(text)

          # 3) HQLS route: parallel preflight, explicit Terra model, low-latency first pass,
          # prompt caching, targeted single-stage repair, smaller output ceilings, parallel post-save I/O.
          path = Path("app/api/hqls/route.ts")
          text = path.read_text()
          text = text.replace(
              'const AI_RUNS_PER_MINUTE = 6;',
              'const AI_RUNS_PER_MINUTE = 6;\nconst HQLS_MAX_OUTPUT_TOKENS = 8000;\nconst HQLS_STAGE_REPAIR_MAX_OUTPUT_TOKENS = 3500;',
              1,
          )
          old_model_fn = '''function configuredOpenAIModel() {\n  return (\n    process.env.KSI_OPENAI_MODEL?.trim() ||\n    process.env.KSI_AI_MODEL?.trim() ||\n    "gpt-5.6-terra"\n  );\n}\n'''
          new_model_fn = '''function configuredOpenAIModel() {\n  return (\n    process.env.KSI_HQLS_OPENAI_MODEL?.trim() ||\n    process.env.KSI_OPENAI_MODEL?.trim() ||\n    process.env.KSI_AI_MODEL?.trim() ||\n    "gpt-5.6-terra"\n  );\n}\n\nfunction configuredHqlsReasoningEffort(model: string) {\n  return model.startsWith("gpt-5.6") ? ("none" as const) : ("low" as const);\n}\n'''
          if old_model_fn not in text:
              raise SystemExit("Could not find configuredOpenAIModel")
          text = text.replace(old_model_fn, new_model_fn, 1)
          text = text.replace(
              '    const workspace = await requireWorkspace(supabase, validatedInput.workspaceId);\n    const input = await resolveAcademicContext(supabase, validatedInput);',
              '    const [workspace, input] = await Promise.all([\n      requireWorkspace(supabase, validatedInput.workspaceId),\n      resolveAcademicContext(supabase, validatedInput),\n    ]);',
              1,
          )
          text = text.replace(
              '''    await enforceAiRateLimit(supabase, userId, input.workspaceId);\n    const resources = await loadResourceContext(\n      supabase,\n      input.workspaceId,\n      input.resourceIds ?? [],\n    );\n\n    runId = await startAiRun(supabase, {''',
              '''    const [, resources] = await Promise.all([\n      enforceAiRateLimit(supabase, userId, input.workspaceId),\n      loadResourceContext(\n        supabase,\n        input.workspaceId,\n        input.resourceIds ?? [],\n      ),\n    ]);\n    const model = configuredOpenAIModel();\n    const generationStartedAt = Date.now();\n\n    runId = await startAiRun(supabase, {''',
              1,
          )
          text = text.replace(
              '      model: configuredOpenAIModel(),\n      artifactType: "lesson",',
              '      model,\n      artifactType: "lesson",',
              1,
          )
          old_generation_block = '''    const generated = await generateOpenAIJson<unknown>({\n      systemInstruction: buildHqlsGenerationSystemInstruction(),\n      parts: [\n        { text: buildHqlsGenerationPrompt(input, resources.labels) },\n        ...resources.parts,\n      ],\n      responseSchema: HQLS_LESSON_JSON_SCHEMA,\n      schemaName: "ksi_hqls_lesson",\n      maxOutputTokens: 14000,\n    });\n\n    let lesson = parseGeneratedHqlsLesson(generated.data);\n    let validation = validateHqlsLesson(lesson);\n\n    if (!validation.passed) {\n      const repaired = await generateOpenAIJson<unknown>({\n        systemInstruction: buildHqlsGenerationSystemInstruction(),\n        parts: [\n          { text: buildHqlsRepairPrompt(input, lesson, validation) },\n          ...resources.parts,\n        ],\n        responseSchema: HQLS_LESSON_JSON_SCHEMA,\n        schemaName: "ksi_hqls_lesson_repair",\n        maxOutputTokens: 14000,\n      });\n      lesson = parseGeneratedHqlsLesson(repaired.data);\n      validation = validateHqlsLesson(lesson);\n    }\n'''
          new_generation_block = '''    const generated = await generateOpenAIJson<unknown>({\n      systemInstruction: buildHqlsGenerationSystemInstruction(),\n      parts: [\n        { text: buildHqlsGenerationPrompt(input, resources.labels) },\n        ...resources.parts,\n      ],\n      responseSchema: HQLS_LESSON_JSON_SCHEMA,\n      schemaName: "ksi_hqls_lesson",\n      model,\n      reasoningEffort: configuredHqlsReasoningEffort(model),\n      promptCacheKey: `ksi-hqls-${HQLS_PROMPT_VERSION}`,\n      promptCacheTtl: "30m",\n      textVerbosity: "low",\n      maxOutputTokens: HQLS_MAX_OUTPUT_TOKENS,\n    });\n\n    let lesson = parseGeneratedHqlsLesson(generated.data);\n    let validation = validateHqlsLesson(lesson);\n    let repairMode: "none" | "single_stage" | "full_lesson" = "none";\n    let repairDurationMs = 0;\n\n    if (!validation.passed) {\n      const failedStages = lesson.stages.filter(\n        (stage) => !validation.stageValidation[stage.stageKey]?.passed,\n      );\n\n      if (failedStages.length === 1) {\n        repairMode = "single_stage";\n        const targetStage = failedStages[0];\n        const targetViolations = validation.violations.filter(\n          (item) => item.stageKey === targetStage.stageKey,\n        );\n        const stageValidation = validation.stageValidation[targetStage.stageKey];\n        const repairPrompt = `${buildStageRegenerationPrompt({\n          lesson,\n          targetStage,\n          action: "improve",\n          lessonContext: lessonContextSummary(input),\n        })}\n\nDeterministic fidelity issues that must be fixed before returning this stage:\n${(\n          targetViolations.length\n            ? targetViolations.map((item) => `${item.code}: ${item.message}`)\n            : stageValidation.violations\n        )\n          .map((item) => `- ${item}`)\n          .join("\\n")}`;\n        const repaired = await generateOpenAIJson<unknown>({\n          systemInstruction: buildHqlsGenerationSystemInstruction(),\n          parts: [{ text: repairPrompt }, ...resources.parts],\n          responseSchema: HQLS_STAGE_JSON_SCHEMA,\n          schemaName: "ksi_hqls_stage_repair",\n          model,\n          reasoningEffort: "low",\n          promptCacheKey: `ksi-hqls-${HQLS_PROMPT_VERSION}-stage-repair`,\n          promptCacheTtl: "30m",\n          textVerbosity: "low",\n          maxOutputTokens: HQLS_STAGE_REPAIR_MAX_OUTPUT_TOKENS,\n        });\n        repairDurationMs = repaired.durationMs;\n        const replacement = parseHqlsStageContent(\n          repaired.data,\n          targetStage.stageNumber,\n        );\n        lesson = {\n          ...lesson,\n          stages: lesson.stages.map((stage) =>\n            stage.stageNumber === replacement.stageNumber ? replacement : stage,\n          ),\n        };\n        validation = validateHqlsLesson(lesson);\n      } else {\n        repairMode = "full_lesson";\n        const repaired = await generateOpenAIJson<unknown>({\n          systemInstruction: buildHqlsGenerationSystemInstruction(),\n          parts: [\n            { text: buildHqlsRepairPrompt(input, lesson, validation) },\n            ...resources.parts,\n          ],\n          responseSchema: HQLS_LESSON_JSON_SCHEMA,\n          schemaName: "ksi_hqls_lesson_repair",\n          model,\n          reasoningEffort: "low",\n          promptCacheKey: `ksi-hqls-${HQLS_PROMPT_VERSION}-repair`,\n          promptCacheTtl: "30m",\n          textVerbosity: "low",\n          maxOutputTokens: HQLS_MAX_OUTPUT_TOKENS,\n        });\n        repairDurationMs = repaired.durationMs;\n        lesson = parseGeneratedHqlsLesson(repaired.data);\n        validation = validateHqlsLesson(lesson);\n      }\n    }\n'''
          if old_generation_block not in text:
              raise SystemExit("Could not find original HQLS generation/repair block")
          text = text.replace(old_generation_block, new_generation_block, 1)
          old_persist = '''    const savedLesson = persisted.lesson as LessonRow;\n    await saveLessonValidation({ supabase, lesson: savedLesson, validation });\n    await attachAiRunArtifact(supabase, runId, savedLesson.id);\n    await persistFidelityCheck({\n      supabase,\n      lessonId: savedLesson.id,\n      validation,\n    });\n    await linkResources({\n      supabase,\n      workspaceId: input.workspaceId,\n      lessonId: savedLesson.id,\n      userId,\n      resources: resources.rows,\n    });\n    await completeAiRun(supabase, runId, "succeeded");\n\n    const refreshed = await fetchLessonWithStages(supabase, savedLesson.id);'''
          new_persist = '''    const savedLesson = persisted.lesson as LessonRow;\n    await saveLessonValidation({ supabase, lesson: savedLesson, validation });\n    await Promise.all([\n      attachAiRunArtifact(supabase, runId, savedLesson.id),\n      persistFidelityCheck({\n        supabase,\n        lessonId: savedLesson.id,\n        validation,\n      }),\n      linkResources({\n        supabase,\n        workspaceId: input.workspaceId,\n        lessonId: savedLesson.id,\n        userId,\n        resources: resources.rows,\n      }),\n    ]);\n    await completeAiRun(supabase, runId, "succeeded");\n\n    const refreshed = await fetchLessonWithStages(supabase, savedLesson.id);\n    console.info(\n      "KSI_HQLS_TIMING",\n      JSON.stringify({\n        model,\n        firstPassMs: generated.durationMs,\n        repairMs: repairDurationMs,\n        repairMode,\n        providerMs: generated.durationMs + repairDurationMs,\n        totalFromGenerationStartMs: Date.now() - generationStartedAt,\n        resourceCount: resources.rows.length,\n      }),\n    );'''
          if old_persist not in text:
              raise SystemExit("Could not find HQLS persistence block")
          text = text.replace(old_persist, new_persist, 1)
          path.write_text(text)

          # 4) Regression guard.
          Path("scripts/verify-hqls-generation-performance.mjs").write_text('''import { readFile } from "node:fs/promises";\nimport { join } from "node:path";\n\nconst ROOT = process.cwd();\nconst route = await readFile(join(ROOT, "app/api/hqls/route.ts"), "utf8");\nconst engine = await readFile(join(ROOT, "lib/hqls/engine.ts"), "utf8");\nconst openai = await readFile(join(ROOT, "lib/ai/openai.ts"), "utf8");\n\nconst assert = (condition, message) => {\n  if (!condition) throw new Error(message);\n};\n\nfor (const requirement of [\n  "HQLS_MAX_OUTPUT_TOKENS = 8000",\n  "HQLS_STAGE_REPAIR_MAX_OUTPUT_TOKENS = 3500",\n  "KSI_HQLS_OPENAI_MODEL",\n  "configuredHqlsReasoningEffort",\n  "promptCacheKey",\n  'textVerbosity: "low"',\n  'repairMode: "none" | "single_stage" | "full_lesson"',\n  "KSI_HQLS_TIMING",\n]) {\n  assert(route.includes(requirement), `HQLS performance requirement missing: ${requirement}`);\n}\n\nassert(\n  route.includes("const [workspace, input] = await Promise.all") &&\n    route.includes("const [, resources] = await Promise.all"),\n  "HQLS preflight work must remain parallelised.",\n);\nassert(\n  route.includes('schemaName: "ksi_hqls_stage_repair"') &&\n    route.includes("failedStages.length === 1"),\n  "A single deterministic stage failure must use targeted repair rather than a full lesson rewrite.",\n);\nassert(\n  !route.includes("maxOutputTokens: 14000"),\n  "The HQLS generation path must not regress to the old 14k output ceiling.",\n);\nassert(\n  engine.includes('HQLS_PROMPT_v1.4') &&\n    engine.includes("roughly 250–450 words") &&\n    !engine.includes("Do not artificially shorten Full Illumination"),\n  "HQLS prompting must keep Full Illumination concise and objective-led.",\n);\nfor (const requirement of [\n  'OpenAIReasoningEffort = "none"',\n  "input.model?.trim()",\n  "prompt_cache_key",\n  "prompt_cache_options",\n  "verbosity: input.textVerbosity",\n  '"gpt-5.6-terra"',\n]) {\n  assert(openai.includes(requirement), `OpenAI low-latency control missing: ${requirement}`);\n}\n\nconsole.log(\n  "HQLS generation performance verification passed: concise output, cached low-reasoning first pass, targeted repair and parallel I/O are enforced.",\n);\n''')

          package = Path("package.json")
          package_text = package.read_text()
          marker = '&& node scripts/verify-hqls-pdf-teacher-focus.mjs",'
          replacement = '&& node scripts/verify-hqls-pdf-teacher-focus.mjs && node scripts/verify-hqls-generation-performance.mjs",'
          if marker not in package_text:
              raise SystemExit("Could not find PDF verification hook in package.json")
          package.write_text(package_text.replace(marker, replacement, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-hqls-generation-performance.yml
          git add lib/ai/openai.ts lib/hqls/engine.ts app/api/hqls/route.ts package.json scripts/verify-hqls-generation-performance.mjs
          git commit -m "Reduce HQLS generation latency"
          git push origin HEAD:fix/hqls-pdf-teacher-focus
