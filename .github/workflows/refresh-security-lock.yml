name: Refresh security lockfile

on:
  push:
    branches:
      - fix/teacher-artifact-isolation
    paths:
      - package.json
      - .github/workflows/refresh-security-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/teacher-artifact-isolation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify dependency audit
        run: npm audit --audit-level=high

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate secure dependency lockfile"
          git push origin HEAD:fix/teacher-artifact-isolation
