name: Stage 1 Runtime Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/stage1-runtime-smoke.yml

permissions:
  contents: read

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KSI_SUPABASE_URL: https://zaoxfjbiizargeclnzmo.supabase.co
      KSI_SUPABASE_PUBLISHABLE_KEY: sb_publishable_grqUBVOShJOM3i9jMF9ucg_gI4xr-58

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exercise real Supabase signup bootstrap
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const { createClient } = require('@supabase/supabase-js');

          const url = process.env.KSI_SUPABASE_URL;
          const key = process.env.KSI_SUPABASE_PUBLISHABLE_KEY;
          const marker = `ksi.stage1.${process.env.GITHUB_RUN_ID}`;

          function client() {
            return createClient(url, key, {
              auth: { persistSession: false, autoRefreshToken: false },
            });
          }

          async function signUp(label) {
            const supabase = client();
            const email = `${marker}.${label}@gmail.com`;
            const password = `Ksi!${crypto.randomBytes(24).toString('base64url')}7a`;
            const { data, error } = await supabase.auth.signUp({
              email,
              password,
              options: { data: { full_name: `KSI Stage 1 ${label.toUpperCase()}` } },
            });
            if (error) throw error;
            if (!data.user?.id) throw new Error(`Signup ${label} returned no user id`);
            return { supabase, userId: data.user.id, email, hasSession: Boolean(data.session) };
          }

          async function bootstrapState(supabase, userId) {
            const { data: profile, error: profileError } = await supabase
              .from('profiles')
              .select('id,default_workspace_id')
              .eq('id', userId)
              .maybeSingle();
            if (profileError) throw profileError;
            const { data: workspaces, error: workspaceError } = await supabase
              .from('workspaces')
              .select('id,workspace_type');
            if (workspaceError) throw workspaceError;
            return { profile, workspaces };
          }

          (async () => {
            const a = await signUp('a');
            const b = await signUp('b');
            console.log(`fixture_user_a=${a.userId}`);
            console.log(`fixture_email_a=${a.email}`);
            console.log(`fixture_user_b=${b.userId}`);
            console.log(`fixture_email_b=${b.email}`);
            console.log(`fixture_a_session=${a.hasSession}`);
            console.log(`fixture_b_session=${b.hasSession}`);

            if (!a.hasSession || !b.hasSession) {
              console.log('runtime_result=email_confirmation_required');
              console.log('signup_users_created=true');
              return;
            }

            const stateA = await bootstrapState(a.supabase, a.userId);
            const stateB = await bootstrapState(b.supabase, b.userId);
            if (!stateA?.profile?.default_workspace_id || stateA.workspaces?.length !== 1) {
              throw new Error('User A bootstrap did not create exactly one visible private workspace');
            }
            if (!stateB?.profile?.default_workspace_id || stateB.workspaces?.length !== 1) {
              throw new Error('User B bootstrap did not create exactly one visible private workspace');
            }
            if (stateA.workspaces[0].id === stateB.workspaces[0].id) {
              throw new Error('Users unexpectedly share a private workspace');
            }

            const foreignA = await a.supabase
              .from('workspaces')
              .select('id')
              .eq('id', stateB.workspaces[0].id);
            if (foreignA.error) throw foreignA.error;
            if ((foreignA.data ?? []).length !== 0) {
              throw new Error('User A can read User B workspace');
            }

            const insertForeign = await a.supabase.from('lessons').insert({
              workspace_id: stateB.workspaces[0].id,
              created_by: a.userId,
              title: 'Forbidden cross-tenant write',
              topic: 'Isolation',
              objective: 'This insert must be rejected',
            });
            if (!insertForeign.error) {
              throw new Error('Cross-tenant lesson insert unexpectedly succeeded');
            }

            console.log('runtime_result=authenticated_isolation_passed');
          })().catch((error) => {
            console.error(error?.message ?? error);
            process.exitCode = 1;
          });
          NODE
